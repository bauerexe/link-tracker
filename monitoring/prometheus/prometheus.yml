global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: scrapper
    metrics_path: /metrics
    static_configs:
      - targets:
          - scrapper:8080
        labels:
          application: scrapper
          application_type: scrapper

  - job_name: bot
    metrics_path: /metrics
    static_configs:
      - targets:
          - bot:8011
        labels:
          application: bot
          application_type: bot
