version: "3.9"

services:
  valkey-node-1:
    image: bitnamilegacy/valkey:8.1.3-debian-12-r3
    container_name: valkey-node-1
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      VALKEY_REPLICATION_MODE: primary
    ports:
      - "6379:6379"
    volumes:
      - valkey_node_1_data:/bitnami/valkey/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey-node-2:
    image: bitnamilegacy/valkey:8.1.3-debian-12-r3
    container_name: valkey-node-2
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      VALKEY_REPLICATION_MODE: replica
      VALKEY_PRIMARY_HOST: valkey-node-1
      VALKEY_PRIMARY_PORT_NUMBER: "6379"
    depends_on:
      valkey-node-1:
        condition: service_healthy
    volumes:
      - valkey_node_2_data:/bitnami/valkey/data

  valkey-node-3:
    image: bitnamilegacy/valkey:8.1.3-debian-12-r3
    container_name: valkey-node-3
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      VALKEY_REPLICATION_MODE: replica
      VALKEY_PRIMARY_HOST: valkey-node-1
      VALKEY_PRIMARY_PORT_NUMBER: "6379"
    depends_on:
      valkey-node-1:
        condition: service_healthy
    volumes:
      - valkey_node_3_data:/bitnami/valkey/data
  postgres:
    image: postgres:17
    container_name: link-tracker-postgres
    environment:
      POSTGRES_DB: link_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d link_tracker" ]
      interval: 5s
      timeout: 5s
      retries: 10


  flyway:
    image: flyway/flyway:10
    container_name: link-tracker-flyway
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/link_tracker
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_CONNECT_RETRIES: 60
    command: migrate
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-1:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-1:19092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-2:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-2:19092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-3:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-3:19092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  init-kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: init_kafka
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        kafka-topics --bootstrap-server kafka-1:19092 \
          --create \
          --if-not-exists \
          --topic link.raw-updates \
          --partitions 3 \
          --replication-factor 3

        kafka-topics --bootstrap-server kafka-1:19092 \
          --create \
          --if-not-exists \
          --topic link.processed-updates \
          --partitions 3 \
          --replication-factor 3

        kafka-topics --bootstrap-server kafka-1:19092 \
          --create \
          --if-not-exists \
          --topic dead-letter-topic \
          --partitions 3 \
          --replication-factor 3

        kafka-topics --bootstrap-server kafka-1:19092 --list

        echo "kafka topics created"
  schema-registry:
    image: confluentinc/cp-schema-registry:7.3.2
    container_name: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:19092,PLAINTEXT://kafka-2:19092,PLAINTEXT://kafka-3:19092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  init-schema:
    image: badouralix/curl-jq
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ./schemas/update_link_request.avsc:/schemas/update_link_request.avsc:ro
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        jq -Rs '{schema: .}' /schemas/update_link_request.avsc > /tmp/schema.json

        curl -f -s -X POST http://schema-registry:8081/subjects/update_link_request/versions \
          -H "Content-Type: application/vnd.schemaregistry.v1+json" \
          --data @/tmp/schema.json

        curl -f -s http://schema-registry:8081/subjects/update_link_request/versions/latest

        echo "schema registered"
  scrapper:
    build:
      context: .
      dockerfile: Dockerfile.scrapper
    working_dir: /app
    environment:
      CONFIG_PATH: /app/app.env
      KAFKA_TOPIC: link.raw-updates
    volumes:
      - ./app.env:/app/app.env:ro
      - ./app.nocache.test.env:/app/app.nocache.test.env:ro
      - ./app.valkey.test.env:/app/app.valkey.test.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      init-schema:
        condition: service_completed_successfully
      init-kafka:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
      valkey-node-1:
        condition: service_started
    ports:
      - "8080:8080"
      - "50051:50051"

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    working_dir: /app
    environment:
      CONFIG_PATH: /app/app.env
      KAFKA_TOPIC: link.raw-updates
      AI_AGENT_OUTPUT_TOPIC: link.processed-updates
    volumes:
      - ./app.env:/app/app.env:ro
    depends_on:
      init-schema:
        condition: service_completed_successfully
      init-kafka:
        condition: service_completed_successfully
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    working_dir: /app
    environment:
      CONFIG_PATH: /app/app.env
      KAFKA_TOPIC: link.processed-updates
      BOT_METRICS_ADDR: 0.0.0.0:8011
    volumes:
      - ./app.env:/app/app.env:ro
    depends_on:
      init-schema:
        condition: service_completed_successfully
      init-kafka:
        condition: service_completed_successfully
      scrapper:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8082:8082"
      - "50052:50052"
      - "8011:8011"

  prometheus:
    image: prom/prometheus:latest
    container_name: link-tracker-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      scrapper:
        condition: service_started
      bot:
        condition: service_started
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: link-tracker-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
  k6:
    image: grafana/k6:latest
    profiles:
      - load
    volumes:
      - ./load/k6:/scripts:ro
      - ./load/results:/results
    entrypoint: [ "k6" ]
    depends_on:
      scrapper:
        condition: service_started

volumes:
  postgres_data:
  valkey_node_1_data:
  valkey_node_2_data:
  valkey_node_3_data:
